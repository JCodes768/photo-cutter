name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PhotoCutter-windows
            ext: .exe
          - os: macos-latest
            artifact: PhotoCutter-macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed
          --collect-all tkinterdnd2
          --name PhotoCutter
          app_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/PhotoCutter${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoCutter-windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: PhotoCutter-macos
          path: artifacts/macos

      - name: Make macOS binary executable
        run: chmod +x artifacts/macos/PhotoCutter

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/PhotoCutter.exe
            artifacts/macos/PhotoCutter
